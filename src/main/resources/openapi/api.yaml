
openapi: 3.0.3

info:
  title: API Mecânica
  description: REST API do projeto da Mecânica
  version: 1.0.0

servers:
  - url: /mecanica

tags:
  - name: autenticacaoV1
    description: Grupo de endpoints v1 para cadastro e autenticação de usuários
  - name: clienteV1
    description: Grupo de endpoints v1 para gerenciamento de clientes
  - name: veiculoV1
    description: Grupo de endpoints v1 para gerenciamento de veículos
  - name: pecaV1
    description: Grupo de endpoints v1 para gerenciamento de peças
  - name: insumoV1
    description: Grupo de endpoints v1 para gerenciamento de insumos
  - name: ordemServicoV1
    description: Grupo de endpoints v1 para gerenciamento de ordens de serviço
  - name: estoqueV1
    description: Grupo de endpoints v1 para controle de estoque de produtos

paths:
  /v1/auth/registrar:
    post:
      tags:
        - autenticacaoV1
      operationId: registrarV1
      summary: Cadastra um usuário
      description: Cadastra um usuário para autenticação (endpoint público)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequestDTOV1'
      responses:
        '201':
          description: Usuário cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Login já cadastrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetail'
  /v1/auth/autenticar:
    post:
      tags:
        - autenticacaoV1
      operationId: autenticarV1
      summary: Gera o token JWT
      description: Autentica por login e senha e retorna um token JWT (endpoint público)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequestDTOV1'
      responses:
        '200':
          description: Token gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTOV1'

  /v1/clientes:
    get:
      tags:
        - clienteV1
      operationId: listaClientesV1
      summary: Lista os clientes
      description: Lista os clientes da mecânica
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteResponseDTOV1'
    post:
      tags:
        - clienteV1
      operationId: cadastrarClienteV1
      summary: Cadastra um cliente
      description: Cadastra um cliente na mecânica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequestDTOV1'
      responses:
        '201':
          description: Cliente cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/clientes/{id}:
    get:
      tags:
        - clienteV1
      operationId: buscarClienteV1
      summary: Busca um cliente
      description: Busca um cliente específico pelo ID
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - clienteV1
      operationId: excluirClienteV1
      summary: Exclui um cliente
      description: Exclui um cliente específico pelo ID
      parameters:
        - $ref: '#/components/parameters/ClienteId'
      responses:
        '204':
          description: Cliente excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/veiculos:
    get:
      tags:
        - veiculoV1
      operationId: listaVeiculosV1
      summary: Lista os veículos
      description: Lista os veículos da mecânica
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VeiculoResponseDTOV1'
    post:
      tags:
        - veiculoV1
      operationId: cadastrarVeiculoV1
      summary: Cadastra um veículo
      description: Cadastra um veículo na mecânica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeiculoRequestDTOV1'
      responses:
        '201':
          description: Veículo cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/veiculos/{id}:
    get:
      tags:
        - veiculoV1
      operationId: buscarVeiculoV1
      summary: Busca um veículo
      description: Busca um veículo específico pelo ID
      parameters:
        - $ref: '#/components/parameters/VeiculoId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeiculoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - veiculoV1
      operationId: excluirVeiculoV1
      summary: Exclui um veículo
      description: Exclui um veículo específico pelo ID
      parameters:
        - $ref: '#/components/parameters/VeiculoId'
      responses:
        '204':
          description: Veículo excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/pecas:
    get:
      tags:
        - pecaV1
      operationId: listaPecasV1
      summary: Lista as peças
      description: Lista as peças da mecânica
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PecaResponseDTOV1'
    post:
      tags:
        - pecaV1
      operationId: cadastrarPecaV1
      summary: Cadastra uma peça
      description: Cadastra uma peça na mecânica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PecaRequestDTOV1'
      responses:
        '201':
          description: Peça cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PecaResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/pecas/{id}:
    get:
      tags:
        - pecaV1
      operationId: buscarPecaV1
      summary: Busca uma peça
      description: Busca uma peça específica pelo ID
      parameters:
        - $ref: '#/components/parameters/PecaId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PecaResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - pecaV1
      operationId: excluirPecaV1
      summary: Exclui uma peça
      description: Exclui uma peça específica pelo ID
      parameters:
        - $ref: '#/components/parameters/PecaId'
      responses:
        '204':
          description: Peça excluída
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/insumos:
    get:
      tags:
        - insumoV1
      operationId: listaInsumosV1
      summary: Lista os insumos
      description: Lista os insumos da mecânica
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsumoResponseDTOV1'
    post:
      tags:
        - insumoV1
      operationId: cadastrarInsumoV1
      summary: Cadastra um insumo
      description: Cadastra um insumo na mecânica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsumoRequestDTOV1'
      responses:
        '201':
          description: Insumo cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsumoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/insumos/{id}:
    get:
      tags:
        - insumoV1
      operationId: buscarInsumoV1
      summary: Busca um insumo
      description: Busca um insumo específico pelo ID
      parameters:
        - $ref: '#/components/parameters/InsumoId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsumoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - insumoV1
      operationId: excluirInsumoV1
      summary: Exclui um insumo
      description: Exclui um insumo específico pelo ID
      parameters:
        - $ref: '#/components/parameters/InsumoId'
      responses:
        '204':
          description: Insumo excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ordem-servico:
    get:
      tags:
        - ordemServicoV1
      operationId: listaOrdensServicoV1
      summary: Lista as ordens de serviço
      description: Lista as ordens de serviço da mecânica
      parameters:
        - $ref: '#/components/parameters/ClienteIdQuery'
        - $ref: '#/components/parameters/VeiculoIdQuery'
        - $ref: '#/components/parameters/OrdemServicoStatusQuery'
        - $ref: '#/components/parameters/OrdemServicoFilaQuery'
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
    post:
      tags:
        - ordemServicoV1
      operationId: cadastrarOrdemServicoV1
      summary: Cadastra uma ordem de serviço
      description: Cadastra uma ordem de serviço na mecânica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoRequestDTOV1'
      responses:
        '201':
          description: Ordem de serviço cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/ordem-servico/tempo-medio-finalizacao:
    get:
      tags:
        - ordemServicoV1
      operationId: buscarTempoMedioFinalizacaoOrdemServicoV1
      summary: Calcula o tempo médio de finalização das ordens de serviço
      description: Calcula o tempo médio entre a data de abertura e a data de fechamento das ordens de serviço finalizadas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempoMedioFinalizacaoResponseDTOV1'

  /v1/ordem-servico/{id}:
    get:
      tags:
        - ordemServicoV1
      operationId: buscarOrdemServicoV1
      summary: Busca uma ordem de serviço
      description: Busca uma ordem de serviço específica pelo ID
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ordem-servico/{id}/diagnostico/inicio:
    post:
      tags: [ordemServicoV1]
      operationId: iniciarDiagnosticoOrdemServicoV1
      summary: Inicia o diagnóstico da ordem de serviço
      description: Inicia o diagnóstico de uma ordem de serviço recebida, alterando seu status de RECEBIDA para EM_DIAGNOSTICO.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      responses:
        '200':
          description: Diagnóstico iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados
  /v1/ordem-servico/{id}/diagnostico:
    patch:
      tags: [ordemServicoV1]
      operationId: registrarDiagnosticoOrdemServicoV1
      summary: Registra o diagnóstico da ordem de serviço
      description: Registra o diagnóstico e permite atualizar os serviços e produtos com suas quantidades enquanto a OS está EM_DIAGNOSTICO. Listas omitidas preservam os itens atuais; listas vazias removem os itens correspondentes.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticoOrdemServicoDTOV1'
      responses:
        '200':
          description: Diagnóstico registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados
  /v1/ordem-servico/{id}/orcamento:
    post:
      tags: [ordemServicoV1]
      operationId: enviarOrcamentoOrdemServicoV1
      summary: Encaminha o orçamento da ordem de serviço para aprovação
      description: Vincula um orçamento existente à ordem de serviço diagnosticada, registra seu valor total e altera o status para AGUARDANDO_APROVACAO. A comunicação com o solicitante ocorre pelo sistema externo.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioOrcamentoDTOV1'
      responses:
        '200':
          description: Orçamento vinculado e ordem de serviço aguardando aprovação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados
  /v1/ordem-servico/{id}/aprovacao:
    post:
      tags: [ordemServicoV1]
      operationId: aprovarOrdemServicoV1
      summary: Aprova o orçamento da ordem de serviço
      description: Registra a aprovação pelo atendente e vincula um cliente existente ou cadastra/localiza o cliente pelos dados informados. Não movimenta o estoque nem inicia a execução automaticamente.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AprovacaoOrdemServicoDTOV1'
      responses:
        '200':
          description: Ordem de serviço aprovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados

  /v1/ordem-servico/{id}/recusa:
    post:
      tags: [ordemServicoV1]
      operationId: recusarOrdemServicoV1
      summary: Recusa o orçamento da ordem de serviço
      description: Registra o motivo da recusa enquanto a OS aguarda aprovação e ainda não foi aprovada, encerrando-a como RECUSADA sem exigir cadastro de cliente.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivoOrdemServicoDTOV1'
      responses:
        '200':
          description: Ordem de serviço recusada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados
  /v1/ordem-servico/{id}/execucao/inicio:
    post:
      tags: [ordemServicoV1]
      operationId: iniciarExecucaoOrdemServicoV1
      summary: Inicia a execução da ordem de serviço
      description: Inicia a execução de uma OS aprovada e com cliente vinculado, alterando o status para EM_EXECUCAO. O estoque é descontado ao registrar o consumo de cada produto.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      responses:
        '200':
          description: Execução da ordem de serviço iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados
  /v1/ordem-servico/{id}/produtos/{produtoId}/consumo:
    put:
      tags: [ordemServicoV1]
      operationId: registrarConsumoProdutoOrdemServicoV1
      summary: Registra o consumo de um produto na ordem de serviço
      description: >-
        Registra o total acumulado utilizado de uma peça ou insumo durante a execução da OS
        e desconta imediatamente apenas a diferença em relação ao total já registrado.
        Repetir o mesmo total não gera nova baixa. O total não pode diminuir nem ultrapassar
        a quantidade prevista na OS. Não é permitido registrar consumo após concluir a execução.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
        - name: produtoId
          in: path
          required: true
          description: ID do produto associado à ordem de serviço
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumoProdutoDTOV1'
      responses:
        '200':
          description: Consumo registrado e estoque atualizado pela diferença consumida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Estado da OS ou total de consumo incompatível com a operação
        '422':
          description: Estoque insuficiente; o consumo e a baixa são revertidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetail'

  /v1/ordem-servico/{id}/execucao/conclusao:
    post:
      tags: [ordemServicoV1]
      operationId: concluirExecucaoOrdemServicoV1
      summary: Conclui a execução da ordem de serviço
      description: Registra a data de conclusão da execução. Não movimenta o estoque, pois as baixas são feitas ao registrar o consumo dos produtos durante a execução. A OS permanece EM_EXECUCAO até a finalização pelo atendente.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      responses:
        '200':
          description: Execução concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados
  /v1/ordem-servico/{id}/finalizacao:
    post:
      tags: [ordemServicoV1]
      operationId: finalizarOrdemServicoV1
      summary: Finaliza a ordem de serviço
      description: Finaliza uma OS após a conclusão da execução, registra a data de fechamento e altera o status para FINALIZADA. A entrega do veículo é registrada em uma operação separada.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      responses:
        '200':
          description: Ordem de serviço finalizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados
  /v1/ordem-servico/{id}/entrega:
    post:
      tags: [ordemServicoV1]
      operationId: entregarOrdemServicoV1
      summary: Registra a entrega do veículo da ordem de serviço
      description: Registra a entrega do veículo de uma OS já finalizada e altera seu status de FINALIZADA para ENTREGUE.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      responses:
        '200':
          description: Entrega do veículo registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados
  /v1/ordem-servico/{id}/cancelamento:
    post:
      tags: [ordemServicoV1]
      operationId: cancelarOrdemServicoV1
      summary: Cancela a ordem de serviço
      description: Cancela uma OS antes do início da execução, registra o motivo e a data de fechamento e altera o status para CANCELADA, preservando os dados da ordem de serviço. Não movimenta o estoque.
      parameters:
        - $ref: '#/components/parameters/OrdemServicoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivoOrdemServicoDTOV1'
      responses:
        '200':
          description: Ordem de serviço cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdemServicoResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Operação incompatível com o estado ou conflito de dados

  /v1/produtos/{id}/estoque:
    post:
      tags:
        - estoqueV1
      operationId: movimentarEstoqueV1
      summary: Movimenta o estoque de um produto
      description: Aumenta (ENTRADA) ou diminui (SAIDA) o estoque físico de forma atômica, impedindo saldo negativo
      parameters:
        - $ref: '#/components/parameters/ProdutoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovimentacaoEstoqueRequestDTOV1'
      responses:
        '200':
          description: Estoque movimentado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoqueResponseDTOV1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente ou inválido
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Estoque insuficiente para a saída
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetail'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClienteId:
      name: id
      in: path
      required: true
      description: ID do cliente
      schema:
        type: string
        format: uuid
    VeiculoId:
      name: id
      in: path
      required: true
      description: ID do veículo
      schema:
        type: string
        format: uuid
    PecaId:
      name: id
      in: path
      required: true
      description: ID da peça
      schema:
        type: string
        format: uuid
    InsumoId:
      name: id
      in: path
      required: true
      description: ID do insumo
      schema:
        type: string
        format: uuid
    ProdutoId:
      name: id
      in: path
      required: true
      description: ID do produto (peça ou insumo)
      schema:
        type: string
        format: uuid
    OrdemServicoId:
      name: id
      in: path
      required: true
      description: ID da ordem de serviço
      schema:
        type: string
        format: uuid
    ClienteIdQuery:
      name: clienteId
      in: query
      required: false
      description: Filtra pelo ID do cliente
      schema:
        type: string
        format: uuid
    VeiculoIdQuery:
      name: veiculoId
      in: query
      required: false
      description: Filtra pelo ID do veículo
      schema:
        type: string
        format: uuid
    OrdemServicoFilaQuery:
      name: fila
      in: query
      required: false
      description: >-
        Fila operacional. DIAGNOSTICO inclui OS recebidas aguardando início do diagnóstico;
        EXECUCAO inclui OS aprovadas aguardando início da execução;
        FINALIZACAO inclui OS com execução concluída aguardando finalização.
        Combinada com os demais filtros antes da paginação.
      schema:
        type: string
        enum: [DIAGNOSTICO, EXECUCAO, FINALIZACAO]
    OrdemServicoStatusQuery:
      name: status
      in: query
      required: false
      description: Filtra pelo status da ordem de serviço
      schema:
        type: string
  schemas:
    ConsumoProdutoDTOV1:
      type: object
      required: [quantidadeConsumida]
      properties:
        quantidadeConsumida:
          type: integer
          minimum: 1
          description: Total acumulado já utilizado deste produto na OS, não a quantidade adicional
          example: 2
    ItemProdutoOrdemServicoDTOV1:
      type: object
      required: [produtoId, quantidade]
      properties:
        produtoId:
          type: string
          format: uuid
        quantidade:
          type: integer
          minimum: 1
          description: Quantidade inteira de peças ou insumos prevista para a OS
        quantidadeConsumida:
          type: integer
          minimum: 0
          readOnly: true
          description: Quantidade acumulada efetivamente utilizada e já descontada do estoque
    DiagnosticoOrdemServicoDTOV1:
      type: object
      required: [diagnostico]
      properties:
        diagnostico:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
        servicoIds:
          type: array
          nullable: true
          description: Quando omitido, preserva os serviços atuais; lista vazia remove todos.
          items:
            type: string
            format: uuid
        produtos:
          type: array
          nullable: true
          description: Quando omitido, preserva os produtos e quantidades atuais; lista vazia remove todos.
          items:
            $ref: '#/components/schemas/ItemProdutoOrdemServicoDTOV1'
    EnvioOrcamentoDTOV1:
      type: object
      required: [orcamentoId]
      properties:
        orcamentoId:
          type: string
          format: uuid
    AprovacaoOrdemServicoDTOV1:
      type: object
      properties:
        clienteId:
          type: string
          format: uuid
        cliente:
          $ref: '#/components/schemas/ClienteAprovacaoDTOV1'
    ClienteAprovacaoDTOV1:
      type: object
      required: [nome, cpf]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos e dígitos verificadores válidos
        celular:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 120
    MotivoOrdemServicoDTOV1:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'

    ClienteRequestDTOV1:
      type: object
      required:
        - nome
        - celular
        - email
        - cpf
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '.*\S.*'
          example: string
          description: Nome do cliente
        celular:
          type: string
          maxLength: 20
          description: Celular do cliente
        email:
          type: string
          format: email
          maxLength: 120
          description: E-mail do cliente
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF do cliente com 11 dígitos e dígitos verificadores válidos
    ClienteResponseDTOV1:
      type: object
      required:
        - id
        - nome
        - celular
        - email
        - cpf
      properties:
        id:
          type: string
          format: uuid
          description: ID do cliente
        nome:
          type: string
          description: Nome do cliente
        celular:
          type: string
          description: Celular do cliente
        email:
          type: string
          description: E-mail do cliente
        cpf:
          type: string
          description: CPF do cliente
    ErrorObjectDTOV1:
      type: object
      required:
        - name
        - userMessage
      properties:
        name:
          type: string
          description: Nome do campo que gerou o erro
        userMessage:
          type: string
          description: Mensagem de erro do campo
    ErrorResponseDTOV1:
      type: object
      required:
        - status
        - timestamp
        - type
        - title
        - detail
        - userMessage
      properties:
        status:
          type: integer
          description: Código HTTP do erro
        timestamp:
          type: string
          format: date-time
          description: Data e hora em que o erro ocorreu
          example: '2026-01-01T23:59:00.0000000Z'
        type:
          type: string
          description: Tipo do erro
          example: /erro-de-sistema
        title:
          type: string
          description: Título do erro
        detail:
          type: string
          description: Detalhe técnico do erro
        userMessage:
          type: string
          description: Mensagem de erro para o usuário
        objects:
          type: array
          description: Campos que podem ter gerado o erro
          items:
            $ref: '#/components/schemas/ErrorObjectDTOV1'
    ApiProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica a categoria do problema
          example: about:blank
        title:
          type: string
          description: Resumo do problema
        status:
          type: integer
          description: Código HTTP do erro
        detail:
          type: string
          description: Detalhe seguro e legível do erro
        instance:
          type: string
          format: uri
          description: URI da requisição que originou o erro
        campos:
          type: object
          description: Mensagens de validação indexadas pelo nome do campo
          additionalProperties:
            type: string
        errorId:
          type: string
          format: uuid
          description: Identificador para correlacionar erros inesperados com os logs
    MovimentacaoEstoqueRequestDTOV1:
      type: object
      required:
        - operacao
        - quantidade
      properties:
        operacao:
          type: string
          enum:
            - ENTRADA
            - SAIDA
          description: ENTRADA aumenta o estoque, SAIDA diminui
        quantidade:
          type: integer
          format: int32
          minimum: 1
          description: Quantidade a movimentar
    EstoqueResponseDTOV1:
      type: object
      required:
        - produtoId
        - quantidadeEstoque
      properties:
        produtoId:
          type: string
          format: uuid
          description: ID do produto
        quantidadeEstoque:
          type: integer
          format: int32
