          format: double
          description: Valor do insumo
        nome:
          type: string
          description: Nome do insumo
        descricao:
          type: string
          description: Descrição do insumo
        unidadeMedida:
          type: string
          description: Unidade de medida do insumo
    OrdemServicoRequestDTOV1:
