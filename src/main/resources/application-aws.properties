spring.config.import=optional:file:./.env[.properties]
# Ative com SPRING_PROFILES_ACTIVE=aws.
# Use o endpoint DNS do RDS e o certificado CA oficial da AWS.
spring.datasource.url=jdbc:postgresql://${DB_HOST:mecanica-postech-db.cahfxvbl36ji.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:mecanica}?sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT:certs/us-east-1-bundle.pem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


